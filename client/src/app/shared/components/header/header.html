<header class="topbar">
  <div class="header-title">
    <span class="header-kicker">MAISON LUXE <span>/</span> RETAIL</span>
    <h1>Inventory</h1>
  </div>

  <div class="search-container" role="search">
    <label class="category-filter">
      <span class="visually-hidden">Filter by category</span>
      <select
        class="category-select"
        [(ngModel)]="category"
        (change)="onCategoryChange(category)"
        aria-label="Filter by category"
      >
        <option value="">All Categories</option>
        @for (categoryOption of categories; track categoryOption.id) {
          <option [value]="categoryOption.id">{{ categoryOption.name }}</option>
        }
      </select>
      <i class="bi bi-chevron-down" aria-hidden="true"></i>
    </label>

    <label class="search-field">
      <i class="bi bi-search" aria-hidden="true"></i>
      <span class="visually-hidden">Search products</span>
      <input
        type="search"
        class="search-input"
        placeholder="Search products by name or description"
        [(ngModel)]="searchText"
        (keyup.enter)="searchProducts()"
      />
    </label>

    <button
      type="button"
      class="search-button"
      aria-label="Search products"
      (click)="searchProducts()"
    >
      Search
    </button>
  </div>

  <div class="topbar-actions">
    <button
      type="button"
      class="cart-link"
      [attr.aria-label]="'Shopping cart, ' + appState.cartTotalQuantity() + ' items'"
      [attr.aria-expanded]="appState.cartOpen()"
      (click)="appState.openCart()"
    >
      <span class="cart-icon">
        <i class="bi bi-cart3" aria-hidden="true"></i>
        @if (appState.cartTotalQuantity()) {
          <span class="cart-count">{{ appState.cartTotalQuantity() }}</span>
        }
      </span>
      <span class="cart-label">Cart</span>
    </button>

    <div class="profile-divider" aria-hidden="true"></div>

    <details class="profile" #profileMenu>
      <summary class="profile-trigger" aria-label="Open profile menu">
        <i class="bi bi-person-circle" aria-hidden="true"></i>
      </summary>

      <div class="profile-dropdown">
        <div class="profile-dropdown-heading">
          <span class="avatar" aria-hidden="true">{{ userInitials }}</span>
          <div>
            <strong>Nirav Patel</strong>
            <small>Store account</small>
          </div>
        </div>
        <button
          type="button"
          class="profile-menu-item"
          (click)="openAddProduct(profileMenu)"
        >
          <i class="bi bi-plus-square" aria-hidden="true"></i>
          <span>Add Product</span>
        </button>
        <button
          type="button"
          class="profile-menu-item"
          (click)="openEditProduct(profileMenu)"
        >
          <i class="bi bi-pencil-square" aria-hidden="true"></i>
          <span>Edit Product</span>
        </button>
        <div class="profile-menu-divider"></div>
        <button type="button" class="logout-button" (click)="logout()">
          <i class="bi bi-box-arrow-right" aria-hidden="true"></i>
          <span>Log out</span>
        </button>
      </div>
    </details>
  </div>
</header>
