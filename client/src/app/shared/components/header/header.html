<header class="topbar">
  <div class="breadcrumb">MAISON LUXE <span>/</span> RETAIL OVERVIEW</div>

  <div class="container">
    <div class="search-container">
      <!-- Category filter inside search -->
      <select class="category-select" [(ngModel)]="category">
        <option value="">All Categories</option>
        <option value="Clothing">Clothing</option>
        <option value="Shoes">Shoes</option>
        <option value="Watches">Watches</option>
        <option value="Accessories">Accessories</option>
      </select>

      <!-- Search input -->
      <input
        type="text"
        class="search-input"
        placeholder="Search products..."
        [(ngModel)]="searchText"
        (keyup.enter)="searchProducts()"
      />

      <!-- Search button -->
      <button class="search-button" (click)="searchProducts()">
        <i class="bi bi-search"></i>
      </button>
    </div>
  </div>

  <div class="topbar-right">
    <span class="current-date">{{ currentDate | date: 'EEEE, dd MMMM yyyy' }}</span>
    <span class="avatar" aria-label="Nirav Patel">{{ userInitials }}</span>
  </div>
</header>
